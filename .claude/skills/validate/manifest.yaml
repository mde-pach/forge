name: validate
version: 0.1.0
need: >
  Product ideas need to be killed fast or advanced on real evidence — before
  significant build effort — and enthusiasm-shaped noise must not count as demand.
triggers:
  - a new product/feature idea is considered for building
  - "validate <idea>"
  - a go/no-go decision on continuing an existing product bet
context:
  loads: the idea's written hypothesis; prior validation state for this idea;
    web research on demand (competitors, graveyards, communities)
  never: build-stage tooling; synthetic-user output as evidence
contract:
  pre:
    - a written value hypothesis exists ("we help X do Y by doing Z") with the
      riskiest assumptions ranked and a kill/continue threshold set per test
  post:
    - >-
      every evidence item is graded (source reliability × item credibility) and
      traceable to a real signal — a person, a payment, a measured behavior
    - >-
      each test ends in an explicit decision (persevere, pivot, or kill)
      against its pre-registered threshold
  invariants:
    - synthetic/LLM-roleplay output is never reported as validation evidence
    - >-
      "would you use this?" answers, compliments, and friends' enthusiasm never count as demand
    - no test without a decision rule; no unbounded testing loops
verifier: >
  The evidence audit - every claim in the recommendation traces to a graded
  artifact - plus the human at each kill/continue gate.
reports: sbar
evolution:
  signals:
    - validated ideas that later fail post-build (validation criteria too weak)
    - kills later contradicted by a competitor's success (false negatives; see Ladd)
    - ladder steps consistently skipped (ladder mis-ordered for this context)
