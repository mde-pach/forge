name: prospect
version: 0.1.0
need: >
  Finding what to build is the binding constraint — modern ecosystems impose no
  technical limits. Product-worthy gaps (missing bricks, incomplete
  implementations, untranslated patterns) must be discovered continuously and
  brought to the owner's judgment with evidence.
triggers:
  - prospect / find what to build / sweep for opportunities
  - a friction repeats across the owner's own projects or experiments
  - an ecosystem event (new primitive, release, platform capability) newly
    enables a known desire
  - a scheduled sweep
context:
  loads: the owner's frictions logs, repos, and experiment notes; web and GitHub
    research on demand, per documented sweep protocol
  never: trend listicles or AI-generated idea lists as evidence; synthetic
    demand of any kind
contract:
  pre:
    - hunting grounds are defined for the sweep (ecosystems, domains, sources) —
      an unbounded sweep is not a sweep
  post:
    - every candidate is an opportunity record with graded evidence traceable to
      real artifacts (issues, forks, complaints, the owner's own frictions)
    - every record carries a why-now, a graveyard/tarpit check, and a fit note
    - candidates are ranked and delivered as one decision-first brief for a
      judgment discussion — never auto-advanced to validate or build
  invariants:
    - opportunities come only from evidence artifacts, never from brainstorms
      presented as findings
    - prospect concludes "worth judging", never "build this" — judgment is the
      owner's
    - the sweep protocol (sources, queries) is recorded, so an empty sweep is
      auditable
verifier: >
  The evidence audit - every signal in a record resolves to a real, linked
  artifact - plus the owner's judgment discussion.
reports: sbar
evolution:
  signals:
    - one hunting mode's candidates repeatedly judged uninteresting (recalibrate
      or retire the mode)
    - a shipped product traces back to a prospect record (reinforce that mode)
    - sweeps coming back empty (grounds too narrow or protocol too shallow)
