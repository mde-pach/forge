[project]
name = "forge"
version = "0.2.0"
description = "maxime's operating framework for working with Claude"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "mypy>=1.14", "types-PyYAML"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "N", "A", "ARG", "PTH", "EM", "RET", "SLF", "TID", "INP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Hook bodies swallow everything: a raising hook takes the session with it.
"plugins/*/hooks/*.py" = ["BLE001", "S110"]
"plugins/forge-monitor/publish.py" = ["BLE001"]
"plugins/**" = ["INP001", "EXE001"]
"tests/*" = ["INP001", "SLF001"]
