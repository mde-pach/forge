name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layer 1 - the repo's own shape. Cheap, runs on everything.
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: shell syntax + shellcheck (every .sh in the repo)
        run: |
          set -euo pipefail
          # find, not globstar: `**` does not descend into dot-directories, so a
          # glob would silently skip stacks/*/template/.claude/hooks/*.sh - the
          # most important scripts in the repo.
          mapfile -d '' files < <(find bootstrap capabilities scripts stacks plugins -name '*.sh' -type f -print0)
          printf 'checking %d scripts\n' "${#files[@]}"
          [ "${#files[@]}" -ge 15 ] || { echo "expected at least 16 scripts, found ${#files[@]} - the search is wrong"; exit 1; }
          for f in "${files[@]}"; do bash -n "$f"; done
          # The hook fragments are sourced, never executed: tell shellcheck.
          shellcheck --shell=bash --external-sources --severity=warning "${files[@]}"

      - name: capability manifests
        run: |
          set -euo pipefail
          pip install pyyaml
          python3 scripts/validate-manifests.py

      - name: hooks are invoked in a way the exec bit cannot break
        run: |
          set -euo pipefail
          # The previous version of this step asserted mode 100755 in git's
          # index. It failed - correctly - because pushes go through the GitHub
          # API, which writes 100644. But the mode is no longer the property
          # that matters: settings.json invokes the hooks as `bash <script>`
          # precisely so a lost exec bit cannot silently disable a gate. Assert
          # THAT, because it is what makes the mode irrelevant.
          for f in stacks/*/template/.claude/settings.json; do
            python3 - "$f" <<'PY'
          import json, sys
          p = sys.argv[1]
          bad = []
          cfg = json.load(open(p))
          for event, groups in cfg.get("hooks", {}).items():
              for g in groups:
                  for h in g.get("hooks", []):
                      cmd = h.get("command", "")
                      if ".claude/hooks/" in cmd and not cmd.startswith("bash "):
                          bad.append(f"{event}: {cmd}")
          if bad:
              print(f"{p}: hook command(s) not invoked via bash - a lost exec bit "
                    f"would exit 127, which Claude Code treats as NON-blocking:")
              for b in bad:
                  print(f"  {b}")
              sys.exit(1)
          print(f"{p}: all hook commands invoked via bash")
          PY
          done

      - name: the projections build and carry their declared assets
        run: |
          set -euo pipefail
          pip install pyyaml
          # dist/ is a build output (gitignored), so "freshness" is not a thing
          # to check - that it BUILDS, and that the skills are not hollow, is.
          bash bootstrap/build.sh
          test -x dist/plugin/skills/scaffold/scaffold.sh
          test -d dist/plugin/skills/scaffold/stacks/python/template
          test -d dist/plugin/skills/scaffold/stacks/nextjs/template
          # And the same for a real install: the projected skill must run.
          bash bootstrap/install.sh project "$RUNNER_TEMP/installed"
          # Capture, then assert. `cmd | grep -q ... || fail` cannot work here:
          # scaffold.sh with no arguments prints its usage and exits 1 (correct
          # behaviour), and under `set -o pipefail` the pipeline takes THAT
          # status, not grep's - so the check failed even though the usage line
          # was found. Third time a check has tested the wrong thing.
          out=$(bash "$RUNNER_TEMP/installed/.claude/skills/scaffold/scaffold.sh" 2>&1 || true)
          grep -q 'usage: scaffold.sh' <<<"$out" || {
            echo "the projected scaffold skill is not runnable; it printed:"
            printf '%s\n' "$out"
            exit 1
          }

      - name: the monitor cannot be seen by a session
        run: |
          set -euo pipefail
          # 26 executable checks of the design claims: the emitter is silent on
          # every event, can never block a turn, the unit is the session and not
          # the machine, publishing is coalesced but attention never waits, a
          # silent session is flagged rather than hidden, and no daemon is
          # required for the state to be true.
          bash plugins/forge-monitor/verify.sh

      - name: the monitor is not a capability
        run: |
          set -euo pipefail
          # It is deliberately outside the contract: a capability is something a
          # session invokes, and nothing here may be invocable. Guard the
          # boundary rather than trusting it to stay put.
          if find plugins/forge-monitor -name SKILL.md -o -name manifest.yaml | grep -q .; then
            echo "the monitor grew a session-facing surface"; exit 1
          fi
          if [ -d capabilities/monitor ] || [ -d capabilities/forge-monitor ]; then
            echo "the monitor was moved under capabilities/"; exit 1
          fi
          # No daemon: the state must stay true with nothing running.
          for f in collector.py merge.py run.sh; do
            if [ -e "plugins/forge-monitor/$f" ]; then
              echo "a background process is back: $f"; exit 1
            fi
          done
          # And nothing in this repo may install itself at user scope: global
          # config is not reproducible and leaks into unrelated work.
          if grep -rn 'HOME/\.claude/settings\.json\|~/\.claude/settings\.json' \
               --include='*.sh' --include='*.py' bootstrap capabilities plugins scripts \
             | grep -v 'verify\.sh' | grep -qv '^$'; then
            echo "something writes user-scope settings; everything must be packaged"
            grep -rn 'HOME/\.claude/settings\.json\|~/\.claude/settings\.json' \
              --include='*.sh' --include='*.py' bootstrap capabilities plugins scripts | grep -v 'verify\.sh'
            exit 1
          fi

      - name: the plugin and marketplace manifests are valid
        run: |
          set -euo pipefail
          # `claude plugin validate` checks plugin.json, hooks.json syntax, and
          # for the marketplace: schema, duplicate names and source traversal.
          # A malformed hooks.json silently disables the entire plugin, which is
          # exactly the looks-on-but-off failure this repo exists to prevent.
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate ./plugins/forge-monitor
            claude plugin validate .
          else
            python3 -c "import json;json.load(open('.claude-plugin/marketplace.json'))"
            python3 -c "import json;json.load(open('plugins/forge-monitor/.claude-plugin/plugin.json'))"
            python3 -c "import json;json.load(open('plugins/forge-monitor/hooks/hooks.json'))"
            echo "claude CLI absent; validated JSON syntax only"
          fi

      - name: the docs build, with dead links treated as failures
        run: |
          set -euo pipefail
          npm ci
          npm run docs:build

  # Layer 2 - the scaffolds actually work. This is the expensive, load-bearing one.
  scaffold-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: scaffold, and require the verifier to pass
        run: |
          set -euo pipefail
          bash capabilities/scaffold/scaffold.sh python "$RUNNER_TEMP/py-app" 'CI probe | with & weird /chars/' | tee out.txt
          grep -q 'verifier : PASS' out.txt || { echo "the scaffold verifier did not pass"; exit 1; }

      - name: the gate blocks a type error a linter cannot see
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/py-app"
          printf 'x: int = "no"\n' > src/py_app/ci_broken.py
          rm -f .claude/.gate-state
          rc=0; CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/gate.sh </dev/null >/dev/null 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "gate returned $rc, expected 2 (BLOCK)"; exit 1; }
          rm -f src/py_app/ci_broken.py .claude/.gate-state

      - name: the gate recovers a missing CLAUDE_PROJECT_DIR, and blocks with no project
        run: |
          set -euo pipefail
          # The first version of this step asserted "unset => must not exit 0",
          # which is wrong: recovering the project root is the whole point of
          # the fix, and a clean project then legitimately passes. The local
          # test only "passed" because a broken file happened to be present.
          # Two separate properties, tested separately:
          cd /
          # 1. unset, but the project IS findable from the hook's own path:
          #    the gate must still find it and still catch a broken file.
          printf 'x: int = "no"\n' > "$RUNNER_TEMP/py-app/src/py_app/ci_env.py"
          rm -f "$RUNNER_TEMP/py-app/.claude/.gate-state"
          rc=0; env -u CLAUDE_PROJECT_DIR bash "$RUNNER_TEMP/py-app/.claude/hooks/gate.sh" </dev/null >/dev/null 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "gate returned $rc with CLAUDE_PROJECT_DIR unset; expected 2 (it should have derived the root and caught the file)"; exit 1; }
          rm -f "$RUNNER_TEMP/py-app/src/py_app/ci_env.py" "$RUNNER_TEMP/py-app/.claude/.gate-state"
          # 2. hooks copied somewhere with no project at all: must BLOCK,
          #    never pass silently.
          orphan=$(mktemp -d)/proj
          mkdir -p "$orphan/.claude/hooks"
          cp "$RUNNER_TEMP/py-app/.claude/hooks/"*.sh "$orphan/.claude/hooks/"
          rc=0; env -u CLAUDE_PROJECT_DIR bash "$orphan/.claude/hooks/gate.sh" </dev/null >/dev/null 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "gate returned $rc with no pyproject.toml; expected 2 (BLOCK)"; exit 1; }
          d=$(mktemp -d)
          for b in /usr/bin/* /bin/*; do n=$(basename "$b"); [ "$n" = jq ] && continue; ln -sf "$b" "$d/$n" 2>/dev/null || true; done
          rc=0
          printf '{"tool_input":{"file_path":"%s/src/py_app/__init__.py"}}' "$RUNNER_TEMP/py-app" \
            | env -i PATH="$d" HOME="$HOME" CLAUDE_PROJECT_DIR="$RUNNER_TEMP/py-app" \
              bash "$RUNNER_TEMP/py-app/.claude/hooks/fast-check.sh" >/dev/null 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "fast-check returned $rc without jq, expected 2 (BLOCK)"; exit 1; }

      - name: the container image builds
        run: docker build -t forge-ci-py "$RUNNER_TEMP/py-app"

      - name: a name the stdlib already owns is refused
        run: |
          set -euo pipefail
          rc=0; bash capabilities/scaffold/scaffold.sh python "$RUNNER_TEMP/json" 2>/dev/null || rc=$?
          [ "$rc" = 1 ] || { echo "scaffold accepted a stdlib module name"; exit 1; }

  scaffold-nextjs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: scaffold, and require the verifier to pass
        run: |
          set -euo pipefail
          bash capabilities/scaffold/scaffold.sh nextjs "$RUNNER_TEMP/web-app" 'CI probe | with & weird /chars/' | tee out.txt
          grep -q 'verifier : PASS' out.txt || { echo "the scaffold verifier did not pass"; exit 1; }

      - name: the gate is idempotent (next build rewrites tsconfig.json)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/web-app"
          rm -f .claude/.gate-state
          for i in 1 2 3; do
            rc=0; CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/gate.sh </dev/null >/dev/null 2>&1 || rc=$?
            [ "$rc" = 0 ] || { echo "gate run $i returned $rc on a clean tree"; exit 1; }
          done

      - name: the gate blocks a type error Turbopack does not check
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/web-app"
          printf 'export const x: number = "no";\n' > src/app/ci_broken.ts
          rm -f .claude/.gate-state
          rc=0; CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/gate.sh </dev/null >/dev/null 2>&1 || rc=$?
          [ "$rc" = 2 ] || { echo "gate returned $rc, expected 2 (BLOCK)"; exit 1; }
          rm -f src/app/ci_broken.ts .claude/.gate-state

      - name: the loop guard releases once, then re-arms
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/web-app"
          printf 'export const x: number = "no";\n' > src/app/ci_broken.ts
          rm -f .claude/.gate-state
          seq=""
          for _ in 1 2 3 4 5 6; do
            rc=0; CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/gate.sh </dev/null >/dev/null 2>&1 || rc=$?
            seq="$seq$rc"
          done
          rm -f src/app/ci_broken.ts .claude/.gate-state
          [ "$seq" = "220220" ] || { echo "guard sequence was $seq, expected 220220"; exit 1; }

      - name: the container image builds
        run: docker build -t forge-ci-web "$RUNNER_TEMP/web-app"
