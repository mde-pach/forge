[project]
name = "__PROJECT__"
version = "0.1.0"
description = "__DESCRIPTION__"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.3", "ruff>=0.16.3", "pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.build-backend]
module-name = "__MODULE__"
module-root = "src"

# ---------------------------------------------------------------- ruff
# ruff >=0.16 enables ~413 rules by default; a giant `select` list is now an
# anti-pattern. Only the strictness the default set leaves out is listed here.
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "N", "A", "ARG", "PTH", "EM", "RET", "SLF", "TID", "INP"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
local_partial_types = true
warn_unused_configs = true
pretty = true
enable_error_code = [
  "redundant-expr",
  "possibly-undefined",
  "truthy-bool",
  "ignore-without-code",
  "unused-awaitable",
  "explicit-override",
  "mutable-override",
  "deprecated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
