name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: the lockfile is the source of truth, and one that has
      # drifted fails here rather than being silently re-resolved.
      - name: Install from the lockfile, exactly
        run: bun install --frozen-lockfile

      # CI runs THE SAME gate the Stop hook runs - biome ci, tsc --noEmit and
      # next build. One definition of green, so local and CI cannot drift.
      - name: Quality gate (same script as the local hook)
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          FORGE_GATE_NO_RELEASE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bash .claude/hooks/gate.sh < /dev/null

      - name: Audit (high and above)
        run: bun audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image builds
        run: docker build -t __PROJECT__:ci .
