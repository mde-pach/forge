name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: the lockfile is the source of truth and a drifting
      # one fails here. --ignore-scripts blocks dependency install hooks, the
      # usual malware execution path (the default from npm 12 onward). If a
      # dependency genuinely needs its build step, name it:
      #   npm ci --ignore-scripts && npm rebuild sharp
      - name: Install from the lockfile, exactly
        run: npm ci --ignore-scripts

      # CI runs THE SAME gate the Stop hook runs - biome ci, tsc --noEmit and
      # next build. One definition of green, so local and CI cannot drift.
      - name: Quality gate (same script as the local hook)
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          FORGE_GATE_NO_RELEASE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bash .claude/hooks/gate.sh < /dev/null

      - name: Audit (high and above)
        run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image builds
        run: docker build -t __PROJECT__:ci .
